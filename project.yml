name: QuranApp
options:
  bundleIdPrefix: com.quran
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.24.0
targets:
  QuranApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuranApp
        excludes:
          - Support/Info.plist
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: "13 Line Quran"
        PRODUCT_BUNDLE_IDENTIFIER: com.quran.thirteenline
        INFOPLIST_FILE: QuranApp/Support/Info.plist
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_BITCODE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
