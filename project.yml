name: QuranApp
options:
  bundleIdPrefix: com.quran
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.24.0
targets:
  QuranApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuranApp
        excludes:
          - Support/Info.plist
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: "13 Line Quran"
        # Keep a stable Swift module name independent of the spaced product name,
        # otherwise Xcode derives `_3_Line_Quran` and `@testable import QuranApp` fails.
        PRODUCT_MODULE_NAME: QuranApp
        PRODUCT_BUNDLE_IDENTIFIER: com.quran.thirteenline
        INFOPLIST_FILE: QuranApp/Support/Info.plist
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_BITCODE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES

  # Native geometry / hit-testing verification. Hosted by the app so the bundled
  # SQLite database and registered Nastaleeq font are available to the tests.
  QuranAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/QuranAppTests
    dependencies:
      - target: QuranApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quran.thirteenline.tests
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/13 Line Quran.app/13 Line Quran"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  # Real-finger gesture verification: long press must resolve to the touched Ayah.
  QuranAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/QuranAppUITests
    dependencies:
      - target: QuranApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quran.thirteenline.uitests
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: QuranApp
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  QuranApp:
    build:
      targets:
        QuranApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - QuranAppTests
        - QuranAppUITests
