name: Build iOS IPA for Sideloading

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The IPA job stays independent so a test-harness problem can never block the
  # installable artifact.
  build:
    name: Compile Native iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project QuranApp.xcodeproj

      - name: Build Application Binary (iphoneos)
        run: |
          xcodebuild clean build \
            -project QuranApp.xcodeproj \
            -scheme QuranApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r "build/DerivedData/Build/Products/Release-iphoneos/"*.app Payload/
          zip -qr Quran13Line.ipa Payload
          ls -lh Quran13Line.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran13Line-ipa
          path: Quran13Line.ipa
          retention-days: 7

  verify:
    name: Native Layout, Gesture & Screenshot Verification
    runs-on: macos-14
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select simulator devices
        id: devices
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"

          # Newest iOS runtime first, then the preferred device within that runtime.
          select_udid() {
            jq -r --arg prefs "$1" '
              [ .devices
                | to_entries[]
                | select(.key | test("SimRuntime.iOS-"))
                | { v: (.key | split(".") | last | ltrimstr("iOS-") | split("-") | map(tonumber)),
                    devices: [ .value[] | select(.isAvailable) ] }
              ]
              | sort_by(.v) | reverse
              | .[] as $rt
              | ($prefs | split(","))[] as $n
              | $rt.devices[] | select(.name == $n) | .udid
            ' "$RUNNER_TEMP/devices.json" | sed -n 1p
          }

          # Tests run on the tightest geometry available so the thirteen-row grid is
          # verified against the smallest screen; screenshots also cover a large one.
          TEST_UDID="$(select_udid "iPhone SE (3rd generation),iPhone 16,iPhone 15,iPhone 16 Pro Max")"
          SHOT_UDID="$(select_udid "iPhone 16 Pro Max,iPhone 15 Pro Max,iPhone 16 Pro,iPhone 15 Pro,iPhone 16")"
          if [ -z "$TEST_UDID" ]; then
            echo "No available iOS Simulator device was found."
            exit 1
          fi
          if [ -z "$SHOT_UDID" ]; then SHOT_UDID="$TEST_UDID"; fi
          echo "test_udid=$TEST_UDID" >> "$GITHUB_OUTPUT"
          echo "shot_udid=$SHOT_UDID" >> "$GITHUB_OUTPUT"
          echo "Test device: $TEST_UDID"
          echo "Screenshot device: $SHOT_UDID"

      - name: Run native unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project QuranApp.xcodeproj \
            -scheme QuranApp \
            -destination "platform=iOS Simulator,id=${{ steps.devices.outputs.test_udid }}" \
            -derivedDataPath build/Verify \
            -resultBundlePath build/Verify.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture per-page reader screenshots
        if: always()
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Verify/Build/Products -maxdepth 2 -name '13 Line Quran.app' | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Built application or Info.plist not found; skipping screenshots."
            exit 0
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "Info.plist does not contain CFBundleVersion; skipping screenshots."
            exit 0
          fi
          echo "App: $APP_PATH"
          mkdir -p screenshots
          capture() {
            local udid="$1" label="$2"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1 || true
            xcrun simctl install "$udid" "$APP_PATH"
            mkdir -p "screenshots/$label"
            for PAGE in 1 2 3 4 5 28 105 610 613 847 848; do
              xcrun simctl terminate "$udid" com.quran.thirteenline >/dev/null 2>&1 || true
              sleep 1
              xcrun simctl launch "$udid" com.quran.thirteenline -mushafAutomatedRun 1 -mushafInitialPage "$PAGE" >/dev/null
              sleep 4
              xcrun simctl io "$udid" screenshot "screenshots/$label/page-$PAGE.png"
            done
          }
          capture "${{ steps.devices.outputs.test_udid }}" "compact"
          capture "${{ steps.devices.outputs.shot_udid }}" "large"
          ls -lhR screenshots | head -50

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quran13Line-verification
          path: |
            screenshots
            build/Verify.xcresult
          if-no-files-found: warn
          retention-days: 14
